<!doctype html>
<html><head><meta charset="utf-8"><title>IERG2060 cloud connection</title></head><body>
<script>
'use strict';
const channel = <?!= JSON.stringify(channel) ?>;
const allowed = origin => origin === 'https://huhanwj.github.io' || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(origin);
window.addEventListener('message', event => {
  const data = event.data;
  if (event.source !== window.top || !allowed(event.origin) || !data || data.type !== 'ierg-rpc' || data.channel !== channel || typeof data.id !== 'string' || data.id.length > 200 || typeof data.action !== 'string') return;
  const reply = (result, error) => window.top.postMessage({type:'ierg-rpc-result',channel,id:data.id,result,error}, event.origin);
  google.script.run.withSuccessHandler(result => reply(result, null))
    .withFailureHandler(error => reply(null, error.message || 'Cloud request failed.'))
    .rpc(data.action, data.payload || {});
});
// The Apps Script HTML lives inside Google's wrapper iframe.
window.top.postMessage({type:'ierg-ready',channel}, '*');
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>IERG2060 cloud connection</title></head><body>
<script>
'use strict';
const channel = <?!= JSON.stringify(channel) ?>;
const testMode = <?!= JSON.stringify(testMode) ?>;
// A test client may itself be framed by the harness. Only an ancestor with the
// allowed GitHub origin and matching channel can bind this bridge.
const clientWindows = [];
if (testMode) {
  let ancestor = window.parent;
  for (let depth=0; depth<8; depth++) {
    clientWindows.push(ancestor);
    if (ancestor === window.top) break;
    ancestor = ancestor.parent;
  }
} else clientWindows.push(window.top);
let clientWindow = null;
const allowed = origin => origin === 'https://huhanwj.github.io';
window.addEventListener('message', event => {
  const data = event.data;
  if (!clientWindows.includes(event.source) || (clientWindow && event.source !== clientWindow) || !allowed(event.origin) || !data || data.type !== 'ierg-rpc' || data.channel !== channel || typeof data.id !== 'string' || data.id.length > 200 || typeof data.action !== 'string') return;
  clientWindow = event.source;
  const reply = (result, error) => clientWindow.postMessage({type:'ierg-rpc-result',channel,id:data.id,result,error}, event.origin);
  const hasSession = Object.prototype.hasOwnProperty.call(data, 'sessionToken');
  if (hasSession && (typeof data.sessionToken !== 'string' || !/^[a-f0-9]{64}$/.test(data.sessionToken))) {reply(null, 'Your sign-in session expired. Sign in again.');return;}
  const runner = google.script.run.withSuccessHandler(result => reply(result, null))
    .withFailureHandler(error => reply(null, error.message || 'Cloud request failed.'));
  if (testMode) {
    if (hasSession) runner.rpcTest(data.action, data.payload || {}, data.sessionToken);
    else runner.rpcTest(data.action, data.payload || {});
  } else {
    if (hasSession) runner.rpc(data.action, data.payload || {}, data.sessionToken);
    else runner.rpc(data.action, data.payload || {});
  }
});
// The Apps Script HTML lives inside Google's wrapper iframe.
clientWindows.forEach(client => client.postMessage({type:'ierg-ready',channel,environment:testMode ? 'test' : 'production'}, '*'));
</script>
</body></html>

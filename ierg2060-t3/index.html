<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#ffffff">
<title>IERG2060 · Tutorial 3</title><link rel="stylesheet" href="style.css?v=6"><script defer src="vendor/peerjs.min.js"></script><script defer src="vendor/qrcode.js"></script><script type="module" src="app.js?v=6"></script>
</head><body>
<div class="shell">
<header><span class="site-title">IERG2060 · Tutorial 3</span><div class="header-actions"><button id="bonus-open" class="pill">Bonus round</button><button id="settings-open" class="icon-button" aria-label="Draw settings">⚙</button></div></header>
<main>
<section class="draw-table" aria-label="Student draw">
<div class="table-heading"><span id="round-label" class="round-label">THIS DRAW</span><span id="deck-caption"></span></div>
<div id="results" class="results" aria-label="Draw results"></div><p id="announcement" class="sr-only" role="status" aria-live="polite"></p><p id="notice" class="notice" role="status" hidden></p>
<div class="draw-controls">
<div class="count-control"><span class="control-label">STUDENTS TO DRAW</span><div class="count-options"><button data-count="6" class="count-button active" aria-pressed="true">6</button><button data-count="7" class="count-button" aria-pressed="false">7</button><label class="custom-count"><span class="sr-only">Custom number of students</span><input id="count" type="number" min="1" max="35" value="6" aria-label="Number of students to draw"></label></div></div>
<button id="draw" class="draw-button" disabled><span id="draw-label">Draw 6 students</span></button>
<div class="pool-info"><span class="control-label" id="next-round">ELIGIBLE STUDENTS</span><strong id="pool-count">— <small>available</small></strong></div>
</div>
<form id="absence-form" class="absence-control" novalidate><label for="absent">Absent today</label><input id="absent" type="text" autocomplete="off" placeholder="10,21,26" aria-describedby="absence-help"><span id="absence-help">No. separated by commas · no spaces · leave empty if none</span></form>
</section>
</main></div>
<dialog id="settings-dialog"><div class="dialog-heading"><h2>Draw settings</h2><button class="icon-button" data-close="settings-dialog" aria-label="Close settings">×</button></div><p>Import roster numbers, names and previous turns.</p><form id="cloud-form"><label for="cloud-url">Google Apps Script Web app URL</label><input id="cloud-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" required><label for="cloud-key">TA access key</label><input id="cloud-key" type="password" autocomplete="off" required><button class="pill" type="submit">Connect Google Sheets</button></form><p id="cloud-status" role="status">Saved in this browser.</p><div class="settings-actions"><button id="cloud-refresh" class="pill" hidden>Reload cloud progress</button><button id="cloud-names" class="pill" hidden>Refresh names</button><button id="cloud-retry" class="pill" hidden>Retry saving</button><button id="cloud-initialize" class="pill" hidden>Start cloud with these records</button></div><div class="settings-actions"><button id="choose-file" class="pill">Import CSV / JSON</button><input id="import-file" type="file" accept=".csv,.json" hidden><button id="backup" class="pill">Save draw progress</button></div><details><summary>Import from Google Sheets (replaces progress)</summary><form id="sheet-form"><label for="sheet-url">Tutorial 3 worksheet link</label><input id="sheet-url" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" required><button class="pill" type="submit">Read roster</button></form></details><div id="import-preview" hidden><p id="import-summary"></p><button id="confirm-import" class="pill accent">Use these records</button><button id="cancel-import" class="pill">Cancel</button></div><p id="settings-status" role="status"></p></dialog>
<dialog id="bonus-dialog" class="bonus-dialog"><div class="dialog-heading"><span class="eyebrow">BONUS</span><button class="icon-button" data-close="bonus-dialog" aria-label="Close bonus window">×</button></div><div id="bonus-container"></div></dialog>
</body></html>
